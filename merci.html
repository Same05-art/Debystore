<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merci — Debystore</title>
    <meta name="description" content="Votre commande Debystore a bien été reçue." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .thanks {
        min-height: calc(100vh - 64px);
        display: grid;
        place-items: center;
        padding: 48px 16px;
      }
      .thanks-card {
        width: min(480px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 40px 28px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(12, 12, 12, 0.06);
      }
      .thanks-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--ink);
        display: grid;
        place-items: center;
        font-size: 1.75rem;
        font-weight: 800;
      }
      .thanks-card h1 {
        font-family: var(--display);
        font-size: 1.75rem;
        margin: 0 0 8px;
      }
      .thanks-card .lead {
        color: var(--muted);
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .thanks-details {
        text-align: left;
        background: var(--fog);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
        font-size: 0.9rem;
      }
      .thanks-details p {
        margin: 0 0 8px;
      }
      .thanks-details p:last-child {
        margin-bottom: 0;
      }
      .thanks-details strong {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .thanks-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-whatsapp {
        background: #25d366;
        color: #fff;
        min-height: 48px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 24px;
        font-weight: 600;
        border: 0;
        text-decoration: none;
      }
      .btn-whatsapp:hover {
        background: #1ebe57;
      }
      .btn-whatsapp svg {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="wrap bar">
        <a class="logo" href="index.html">
          <span class="mark">D</span>
          <span>Deby<span>store</span></span>
        </a>
        <nav class="desk">
          <a href="index.html#produits">Boutique</a>
          <a href="index.html#a-propos">À propos</a>
          <a href="index.html#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="thanks">
      <div class="thanks-card">
        <div class="thanks-icon">✓</div>
        <h1>Merci pour votre commande !</h1>
        <p class="lead">
          Nous avons bien reçu votre demande. Notre équipe vous contactera
          rapidement pour confirmer la livraison.
        </p>
        <div class="thanks-details" id="order-summary" style="display: none"></div>
        <div class="thanks-actions">
          <a
            class="btn-whatsapp"
            id="whatsapp-btn"
            href="https://wa.me/2290157858518"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Continuer sur WhatsApp
          </a>
          <a class="btn btn-accent" href="index.html">Retour à la boutique</a>
        </div>
      </div>
    </main>

    <script>
      try {
        const raw = sessionStorage.getItem("debystore-last-order");
        if (raw) {
          const o = JSON.parse(raw);
          const box = document.getElementById("order-summary");
          box.style.display = "block";
          const total =
            typeof o.total === "number"
              ? o.total.toLocaleString("fr-FR") + " FCFA"
              : "";
          box.innerHTML = `
            <p><strong>Nom</strong>${o.name || "—"}</p>
            <p><strong>Adresse</strong>${o.address || "—"}</p>
            <p><strong>Téléphone</strong>${o.phone || "—"}</p>
            ${total ? `<p><strong>Total</strong>${total}</p>` : ""}
          `;
          // Message prérempli pour WhatsApp
          let lines = ["Bonjour Debystore, je viens de passer commande :"];
          if (o.name) lines.push("Nom : " + o.name);
          if (o.address) lines.push("Adresse : " + o.address);
          if (o.phone) lines.push("Tél : " + o.phone);
          if (total) lines.push("Total : " + total);
          if (o.items && o.items.length) {
            lines.push("");
            lines.push("Articles :");
            o.items.forEach((i) => {
              lines.push(
                "- " + i.name + " (" + i.color + " / " + i.size + ") × " + i.qty
              );
            });
          }
          const msg = encodeURIComponent(lines.join("\n"));
          document.getElementById("whatsapp-btn").href =
            "https://wa.me/2290157858518?text=" + msg;
        }
      } catch (_) {}
    </script>
  </body>
</html>
